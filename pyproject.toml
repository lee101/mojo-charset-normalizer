[project]
name = "mojo-charset-normalizer"
version = "0.1.0"
description = "Charset detection and normalization with Mojo kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "charset", "encoding", "unicode"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "charset-normalizer"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-charset-normalizer"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
